name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages (OIDC token + Pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued (not a running) deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and run tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # Fail the build early if an asset URL ignores the /EvolutionLab/ base path.
      - name: Verify base path in build output
        run: |
          grep -q 'href="/EvolutionLab/assets/' dist/index.html
          grep -q 'src="/EvolutionLab/assets/' dist/index.html
          if grep -E '(href|src)="/(assets|favicon)' dist/index.html; then
            echo "Found an asset URL without the /EvolutionLab/ base path" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Pull requests are only built and tested, never deployed.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
